# ============================================================
# Render.com Blueprint Configuration for NyayaBot
# ============================================================
# Single Web Service running FastAPI + Web UI + Telegram Webhook
# Compatible with Render.com Free Tier

services:
  - type: web
    name: nyayabot-web
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
